<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of `--base-href` at build time. Must start and end
    with a slash when serving from a sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Rudransh CT — admin panel for Rudransh Charitable Trust: yojna, members, agents and payment records.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rudransh CT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>


  <title>Rudransh CT · Admin Panel</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Cloudflare Turnstile for the public member lookup (IMPLEMENTATION_PLAN
    Phase 15). `render=explicit` stops it drawing itself: the Flutter widget in
    lib/features/portal/turnstile_web.dart renders it into its own element and
    waits for this script to arrive. Harmless on every other page — nothing
    calls it there. See docs/RUNBOOK.md §1.7 for the keys.
  -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
          async defer></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overscroll-behavior: none;
    }

    /* Shown until the Flutter engine takes over. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #boot .mark {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      background: #111113;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0A0A0B; }
      #boot .mark { background: #EDEDEF; color: #0B0B0D; }
    }
  </style>
</head>
<body>
  <div id="boot"><div class="mark">R</div></div>

  <script>
    // Remove the boot splash as soon as Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
